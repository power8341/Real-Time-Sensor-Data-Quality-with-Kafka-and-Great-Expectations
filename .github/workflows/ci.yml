name: CI/CD - Sensor Data Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Start Kafka KRaft
      run: |
        docker run -d --name kafka -p 9092:9092 apache/kafka:3.7.0 \
          kafka-server-start /opt/kafka/config/kraft/server.properties \
          --override listeners=PLAINTEXT://0.0.0.0:9092 \
          --override advertised.listeners=PLAINTEXT://localhost:9092 \
          --override log.dirs=/tmp/kraft-combined-logs
        sleep 30
        
    - name: Run producer
      run: timeout 20s python3 sensor_data_producer.py || true
      
    - name: Run Great Expectations validation
      run: python3 run_checkpoint.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: eteja014/sensor-validator:${{ github.sha }},eteja014/sensor-validator:latest
